{% extends 'mainapp/base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h3 class="card-title text-center mb-4">User Login</h3>
                
                <form method="post">
                    {% csrf_token %}
                    
                    {% for field in form %}
                        <div class="mb-3">
                            <label class="form-label fw-bold">{{ field.label }}</label>
                            {{ field }}
                            {% for error in field.errors %}
                                <div class="text-danger small mt-1">{{ error }}</div>
                            {% endfor %}
                        </div>
                    {% endfor %}

                    <button type="submit" class="btn btn-primary w-100 py-2 mt-2">Login</button>
                </form>

                <hr class="my-4">
                <p class="text-center text-muted mb-0">
                    Don't have an account? <a href="{% url 'register' %}">Register now</a>.
                </p>
            </div>
        </div>
    </div>
</div>

<script>
    // Add Bootstrap classes to Django login inputs automatically
    document.querySelectorAll('input').forEach(input => {
        if (!input.classList.contains('form-control')) {
            input.classList.add('form-control');
        }
    });
</script>
{% endblock %}
